services:
  cipta-portfolio:
    image: ghcr.io/ciptacoding/ciptadwipajaya.id:latest
    container_name: ciptadwipajaya.id
    restart: unless-stopped
    # Analytics numbers are read from these at container start (see
    # docker/40-analytics-config.sh). Edit .env then `docker compose up -d`
    # to change them — no image rebuild needed.
    env_file:
      - .env
    ports:
      - "3000:80"   # sesuaikan port (3000 = contoh)
