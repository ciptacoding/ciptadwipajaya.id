services:
  cipta-portfolio:
    image: ghcr.io/ciptacoding/ciptadwipajaya.id:latest
    container_name: ciptadwipajaya.id
    restart: unless-stopped
    # Hanya listen di localhost: trafik publik masuk lewat cloudflared tunnel,
    # jadi situs tidak bisa diakses langsung lewat IP VM.
    ports:
      - "127.0.0.1:3000:80"   # sesuaikan port host kalau 3000 sudah dipakai
