server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off; # Menyembunyikan versi Nginx dari scanner

    # Container ini hanya melayani HTTP (port 80). TLS diterminasi di luar
    # (load balancer / reverse proxy). HSTS aman dikirim di sini — browser
    # hanya akan menerapkannya ketika respons akhirnya disajikan via HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;


    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Explicitly deny access to old policy files often probed by VA scanners
    location ~* (crossdomain\.xml|clientaccesspolicy\.xml) {
        deny all;
        return 404;
    }

    # Runtime analytics config is regenerated from env on each container start,
    # so it must never be cached — otherwise updated numbers won't show.
    location = /analytics-config.js {
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
    }

    # Cache static assets
    location /_next/static/ {
        expires 365d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}